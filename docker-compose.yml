version: "3.9"

services:

  # ── PostgreSQL (persistent volume demo) ──────────────────────────────────
  db:
    build: ./db
    container_name: routine-db
    environment:
      POSTGRES_DB: tasksdb
      POSTGRES_USER: tasksuser
      POSTGRES_PASSWORD: taskspass
    volumes:
      - postgres_data:/var/lib/postgresql/data   # named volume → data survives container restarts
    networks:
      - routine-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasksuser -d tasksdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Python / Flask REST API ───────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: routine-backend
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=tasksdb
      - POSTGRES_USER=tasksuser
      - POSTGRES_PASSWORD=taskspass
    depends_on:
      db:
        condition: service_healthy       # wait until postgres is ready
    expose:
      - "5000"
    networks:
      - routine-net
    restart: unless-stopped

  # ── React SPA (built by Vite, served by Nginx) ────────────────────────────
  frontend:
    build: ./frontend
    container_name: routine-frontend
    expose:
      - "80"
    networks:
      - routine-net
    restart: unless-stopped

  # ── Nginx Reverse Proxy (public entry point) ──────────────────────────────
  nginx:
    build: ./nginx
    container_name: routine-nginx
    ports:
      - "80:80"                    # only this port is exposed to the host
    depends_on:
      - frontend
      - backend
    networks:
      - routine-net
    restart: unless-stopped

# ── Shared network ────────────────────────────────────────────────────────────
networks:
  routine-net:
    driver: bridge

# ── Named volumes (data persists across docker compose down / up) ─────────────
volumes:
  postgres_data:

